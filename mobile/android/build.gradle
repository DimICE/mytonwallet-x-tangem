// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath libs.gradle
    classpath libs.google.services
    classpath libs.firebase.crashlytics.gradle

    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
  }
}

plugins {
  alias(libs.plugins.jetbrains.kotlin.android) apply false
  alias(libs.plugins.ktlint) apply false
}

apply from: "variables.gradle"

def tangemLocalProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
  localPropertiesFile.withInputStream { tangemLocalProperties.load(it) }
}

// Enable strict dependency locking at root level
dependencyLocking {
  lockAllConfigurations()
  lockMode = LockMode.STRICT
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven {
      url 'https://maven.pkg.github.com/tangem/tangem-sdk-android'
      credentials {
        username = tangemLocalProperties.getProperty('gpr.user') ?: findProperty('tangemGithubUser') ?: System.getenv('TANGEM_GITHUB_USER') ?: System.getenv('GITHUB_ACTOR')
        password = tangemLocalProperties.getProperty('gpr.key') ?: findProperty('tangemGithubToken') ?: System.getenv('TANGEM_GITHUB_TOKEN') ?: System.getenv('GITHUB_TOKEN')
      }
      content { includeGroup 'com.tangem.tangem-sdk-kotlin' }
    }
  }

  // Enable dependency locking for all configurations
  configurations.configureEach {
    resolutionStrategy.activateDependencyLocking()
  }
}

subprojects {
  apply plugin: 'org.jlleitschuh.gradle.ktlint'

  ktlint {
    version = libs.versions.ktlint.get()
    filter {
      exclude('**/build/**')
      exclude('**/generated/**')
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
